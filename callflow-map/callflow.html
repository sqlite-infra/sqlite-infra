<title>SQLite Call Flow</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #eef1f5;
    --ink: #10151c;
    --muted: #5c6b7a;
    --line: #d9e0e8;
    --accent: #1f7a8c;
    --accent-ink: #0d3b45;
    --cat-lib: #2f6fed;
    --cat-adapter: #1f9e8a;
    --cat-entry: #7b4fd8;
    --cat-test: #9aa6b2;
    --cat-other: #b98a2f;
    --good: #1a8f5a;
    --warn: #b26a00;
    --shadow: 0 1px 2px rgba(16,21,28,.06), 0 8px 24px rgba(16,21,28,.06);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1116; --surface: #131a22; --surface-2: #1a232e; --ink: #e8eef4;
      --muted: #93a2b2; --line: #263340; --accent: #58c0d4; --accent-ink: #cdeef4;
      --cat-lib: #6ea0ff; --cat-adapter: #43c9b2; --cat-entry: #b39af0; --cat-test: #7a8896; --cat-other: #e0b256;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1116; --surface: #131a22; --surface-2: #1a232e; --ink: #e8eef4;
    --muted: #93a2b2; --line: #263340; --accent: #58c0d4; --accent-ink: #cdeef4;
    --cat-lib: #6ea0ff; --cat-adapter: #43c9b2; --cat-entry: #b39af0; --cat-test: #7a8896; --cat-other: #e0b256;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Inter", ui-sans-serif, system-ui, sans-serif; margin: 0; }
  .wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  header h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 4px; text-wrap: balance; }
  header p#sub { color: var(--muted); margin: 0; max-width: 72ch; }
  .eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 11px; font-weight: 600; color: var(--accent); margin: 0 0 10px; }

  .scope { display: inline-flex; gap: 0; margin: 18px 0 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  .scopebtn { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
  .scopebtn + .scopebtn { border-left: 1px solid var(--line); }
  .scopebtn small { font-weight: 400; font-size: 11px; opacity: .8; }
  .scopebtn[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .scopebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin: 16px 0 24px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .tile .n { font-size: 25px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .k { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tile.ok .n { color: var(--good); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .toolbar { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .toolbar label { display: inline-flex; gap: 7px; align-items: center; color: var(--ink); font-size: 13px; cursor: pointer; }
  .toolbar input[type=range] { accent-color: var(--accent); }
  .toolbar .sep { flex: 1; }
  .toolbar .hint { color: var(--muted); font-size: 12px; }

  #graph { width: 100%; height: 620px; display: block; border-radius: 0 0 14px 14px; touch-action: none; }
  @media (max-width: 860px) { #graph { height: 460px; } }

  .side { display: flex; flex-direction: column; gap: 16px; }
  .card { padding: 14px 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 10px; }
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legend .row { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .ring { width: 11px; height: 11px; border-radius: 50%; flex: none; background: transparent; border: 2px dashed var(--accent); }

  .rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .rank li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; }
  .rank .name { font-size: 12.5px; color: var(--ink); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .name:hover { color: var(--accent); }
  .rank .bar { grid-column: 1 / -1; height: 4px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .rank .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .rank .v { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }

  #details .empty { color: var(--muted); font-size: 13px; }
  #details .mod { font-size: 15px; font-weight: 600; word-break: break-all; }
  #details .meta { color: var(--muted); font-size: 12px; margin: 3px 0 12px; }
  .nlist { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 0; }
  .nlist .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 8px; }
  .nlist a { color: var(--ink); font-size: 12.5px; text-decoration: none; cursor: pointer; word-break: break-all; }
  .nlist a:hover { color: var(--accent); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 22px; line-height: 1.7; }
  .foot code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 11.5px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">CodeQL 2.27.0 · call flow map</p>
    <h1>better-sqlite3 Call Flow Map</h1>
    <p id="sub"></p>
    <div class="scope" role="group" aria-label="Graph scope">
      <button class="scopebtn" data-s="runtime" aria-pressed="false">Runtime call graph<small>resolved calls · everything</small></button>
      <button class="scopebtn" data-s="load" aria-pressed="false">Load-time modules<small>require() closure from index.js</small></button>
      <button class="scopebtn" data-s="exec" aria-pressed="true">Execution tree<small>from index.js · what runs on require()</small></button>
    </div>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="layout">
    <div class="panel">
      <div class="toolbar">
        <label id="hideTestsWrap"><input type="checkbox" id="hideTests"> Hide test / conformance</label>
        <label id="minWwrap">Min edge weight <input type="range" id="minW" min="1" max="20" value="1" style="width:110px"> <span class="mono" id="minWv">1</span></label>
        <button id="treeExpand" class="scopebtn" style="border:1px solid var(--line);border-radius:8px;padding:6px 12px" hidden>Expand all</button>
        <span class="sep"></span>
        <span class="hint" id="treeHint" hidden>click a node to expand/collapse · scroll to zoom</span>
        <span class="hint" id="panHint">scroll to zoom · drag background to pan</span>
      </div>
      <svg id="graph"></svg>
    </div>

    <div class="side">
      <div class="panel card" id="details"><h2>Selected module</h2><div class="empty">Click a node to inspect its call flow.</div></div>
      <div class="panel card"><h2>Legend</h2><div class="legend" id="legend"></div></div>
      <div class="panel card"><h2 id="hubsTitle">Top hubs · fan-in</h2><ul class="rank" id="hubs"></ul></div>
    </div>
  </div>

  <p class="foot" id="foot"></p>
</div>

    return [
      {n:DATA.nodes.length, k:"modules run on require"},
      {n:DATA.links.length, k:"require() load edges"},
      {n:m.loadModules+" / "+m.totalModules, k:"module top-levels executed"},
      {n:m.loadFns+" / "+m.totalFns.toLocaleString(), k:"functions actually run"},
      {n:(100*m.loadFns/m.totalFns).toFixed(2)+"%", k:"of functions run at load", ok:true},
      {n:"0", k:"broken requires", ok:true},
    ];
  }
  const m = META.load;
  return [
    {n:m.loadFns, k:"functions that execute", ok:true},
    {n:m.totalFns.toLocaleString(), k:"functions defined (total)"},
    {n:(100*m.loadFns/m.totalFns).toFixed(1)+"%", k:"of functions run at load"},
    {n:m.loadModules+" / "+m.totalModules, k:"module top-levels run"},
    {n:DATA.links.filter(l=>l.type==="call").length, k:"real calls (this graph)"},
    {n:"1", k:"deferred (setImmediate)"},
  ];
}
function renderMeta(){
  document.getElementById("sub").textContent = SUB[scope];
  document.getElementById("tiles").innerHTML = tiles().map(t=>`<div class="tile ${t.ok?'ok':''}"><div class="n mono">${t.n}</div><div class="k">${t.k}</div></div>`).join("");
  document.getElementById("hubsTitle").textContent =
    scope==="runtime" ? "Top hubs · fan-in (called into)" :
    scope==="load" ? "Top hubs · fan-in (required by)" : "Functions that execute at load";
  if(scope==="exec"){
    document.getElementById("legend").innerHTML =
      `<div class="row"><span class="dot" style="background:var(--cat-entry)"></span>index.js — entry (root)</div>`+
      `<div class="row"><span class="dot" style="background:var(--cat-lib)"></span>module top-level runs (require)</div>`+
      `<div class="row"><span class="dot" style="background:var(--good);border-radius:50%"></span>function executes (● called at load)</div>`+
      `<div class="row"><span class="dot" style="background:var(--surface);border:1.5px solid var(--muted)"></span>module already initialized (ref)</div>`+
      `<div class="row" style="color:var(--muted);margin-top:2px">▸ has hidden children · click to expand/collapse</div>`;
  } else {
    let note;
    if(scope==="runtime") note = `<div class="row" style="color:var(--muted);margin-top:2px">Node size = fan-in + fan-out · edge width = call count</div><div class="row"><span class="ring"></span>runs on require() (initializes at load)</div>`;
    else note = `<div class="row" style="color:var(--muted);margin-top:2px">All ${DATA.nodes.length} nodes here run on require('better-sqlite3')</div>`;
    document.getElementById("legend").innerHTML =
      Object.values(CAT).filter(c=>DATA.nodes.some(n=>(CAT[n.cat]||CAT.other)===c)).map(c=>`<div class="row"><span class="dot" style="background:${c.c()}"></span>${c.label}</div>`).join("") + note;
  }
  document.getElementById("hideTestsWrap").hidden = (scope!=="runtime");
  document.getElementById("minWwrap").hidden = (scope==="exec");
  document.getElementById("treeExpand").hidden = (scope!=="exec");
  document.getElementById("treeHint").hidden = (scope!=="exec");
  document.getElementById("panHint").hidden = (scope==="exec");
  const F = `<strong>What runs on <code>require('better-sqlite3')</code>:</strong> Node loads <code>index.js</code> and executes the top-level of ${META.load.loadModules} of ${META.load.totalModules} modules — feature detection, prototype wiring via <code>Object.assign</code>, frozen constant tables. Only <strong>${META.load.loadFns} of ${META.load.totalFns.toLocaleString()} functions</strong> (${(100*META.load.loadFns/META.load.totalFns).toFixed(1)}%) actually execute — small initializers such as <code>schema.quote</code> and <code>dictionary.deepFreeze</code>. Every API method is merely <em>defined</em> and runs later on use. <code>lib/keepalive.js</code> is currently <strong>unreferenced</strong> (nothing requires it), so it does not appear in this scope at all.`;
  document.getElementById("foot").innerHTML = scope==="runtime"
    ? `<strong>Two things this map proves about the code:</strong> all ${META.runtime.files} first-party files extracted with <span class="badge" style="color:var(--good)">0 parse errors</span> and <span class="badge" style="color:var(--good)">0 broken requires</span>. This view is the <em>resolved</em> layer (CodeQL <code>getACallee()</code>). A <em>name-matched</em> layer in <code>data/edges-all.csv</code> recovers the dynamically-dispatched API calls (<code>db.prepare</code>, <code>stmt.run</code>, …) routed through the <code>Object.assign(Database.prototype, …)</code> mixins. Switch scope to see what runs on import, or the exact functions that execute.`
    : F;
}
function nodeLabel(n){ return n.label || short(n.id); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Execution-tree layout (scope === "exec") ---------- */
let treeRoot=null;
const treeLayout = d3.tree().nodeSize([20,210]);
function treeLabel(d){ const n=d.data.name; return d.data.kind==="function"? n : n.replace(/^lib\//,"").replace(/^adapters\//,"a/"); }
function treeColor(d){
  const k=d.data.kind;
  if(d._children) return getVar("--accent");           // collapsed: has hidden children
  if(k==="entry") return getVar("--cat-entry");
  if(k==="function") return getVar("--good");
  if(k==="module-ref") return getVar("--surface");
  return getVar("--cat-lib");
}
function collapseNode(d){ if(d.children){ d._children=d.children; d._children.forEach(collapseNode); d.children=null; } }
function renderTree(){
  sim.stop();
  gLink.selectAll("*").remove(); gNode.selectAll("*").remove();
  selected=null;
  treeRoot = d3.hierarchy(DATA_TREE);
  let i=0; const all = treeRoot.descendants(); all.forEach(d=>{ d.id=++i; d._children=d.children||null; });
  if(treeRoot.children) treeRoot.children.forEach(collapseNode);        // collapse everything under root
  all.filter(d=>d.data.kind==="function").forEach(d=>{                   // re-expand paths to real executions
    let p=d.parent; while(p){ if(p._children){ p.children=p._children; p._children=null; } p=p.parent; }
  });
  treeRoot.x0=0; treeRoot.y0=0;
  updateTree(treeRoot); fitTree();
}
function diagonal(s,t){ const my=(s.y+t.y)/2; return `M${s.y},${s.x}C${my},${s.x} ${my},${t.x} ${t.y},${t.x}`; }
function toggle(d){
  if(d.children){ d._children=d.children; d.children=null; }
  else if(d._children){ d.children=d._children; d._children=null; }
  updateTree(d);
}
function updateTree(source){
  treeLayout(treeRoot);
  const nodes=treeRoot.descendants(), links=treeRoot.links();
  const link=gLink.selectAll("path.tl").data(links, d=>d.target.id);
  link.enter().append("path").attr("class","tl").attr("fill","none").attr("stroke",getVar("--line")).attr("stroke-width",1.4)
      .attr("d", ()=>diagonal({x:source.x0,y:source.y0},{x:source.x0,y:source.y0}))
    .merge(link).transition().duration(200)
      .attr("d",d=>diagonal(d.source,d.target))
      .attr("stroke-dasharray",d=> d.target.data.kind==="module-ref" ? "2 3" : null)
      .attr("stroke", d=> d.target.data.kind==="function" ? getVar("--good") : getVar("--line"));
  link.exit().remove();
  const node=gNode.selectAll("g.tn").data(nodes, d=>d.id);
  const en=node.enter().append("g").attr("class","tn").style("cursor","pointer")
      .attr("transform",`translate(${source.y0},${source.x0})`)
      .on("click",(e,d)=>{ e.stopPropagation(); showTreeDetails(d); toggle(d); });
  en.append("circle");
  en.append("text").attr("class","mono").attr("dy","0.32em").attr("font-size",10);
  const nm=en.merge(node);
  nm.transition().duration(200).attr("transform",d=>`translate(${d.y},${d.x})`);
  nm.select("circle").attr("r",d=> d.data.kind==="function"?5.5:4)
    .attr("fill",treeColor).attr("stroke",d=> d.data.kind==="module-ref"?getVar("--muted"):getVar("--surface")).attr("stroke-width",1.2);
  nm.select("text")
    .attr("x",d=> (d.children||d._children)?-8:8).attr("text-anchor",d=>(d.children||d._children)?"end":"start")
    .attr("fill",getVar("--ink"))
    .attr("font-weight",d=> (d.data.kind==="function"||d.data.kind==="entry")?"700":"400")
    .attr("fill-opacity",d=> d.data.kind==="module-ref"?0.55:1)
    .text(d=> (d.data.kind==="function"?"● ":"") + treeLabel(d) + (d._children?` +${countHidden(d)}`:""));
  node.exit().remove();
  nodes.forEach(d=>{ d.x0=d.x; d.y0=d.y; });
}
function countHidden(d){ let c=0; (function w(n){ (n._children||n.children||[]).forEach(k=>{ c++; w(k); }); })(d); return c; }
function fitTree(){
  const nodes=treeRoot.descendants(); if(!nodes.length) return;
  const xs=nodes.map(d=>d.x), ys=nodes.map(d=>d.y);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const gw=(maxy-miny)+240, gh=(maxx-minx)+50;
  const k=Math.max(0.2, Math.min(1.1, Math.min((W-40)/gw,(H-30)/gh)));
  const ty=(H-(minx+maxx)*k)/2;
  svg.transition().duration(250).call(zoomBehavior.transform, d3.zoomIdentity.translate(40-miny*k, ty).scale(k));
}
function expandAll(){ if(!treeRoot) return; (function e(d){ if(d._children){ d.children=d._children; d._children=null; } (d.children||[]).forEach(e); })(treeRoot); updateTree(treeRoot); fitTree(); }
function showTreeDetails(d){
  const el=document.getElementById("details"); const k=d.data.kind;
  const kl = k==="entry"?"entry — index.js (root)" : k==="function"?"function that executes at load" : k==="module-ref"?"module (already initialized earlier)" : "module top-level (runs at require)";
  const kids=(d.children||d._children||[]);
  el.innerHTML=`<h2>Execution node</h2><div class="mod mono">${esc(d.data.name)}</div>
    <div class="meta">${kl}${d.data.line?` · line ${d.data.line}`:""} · ${d.data.loc||0} LOC · depth ${d.depth}</div>
    <div class="nlist"><div class="lbl">Then runs, in order (${kids.length})</div>
    ${kids.length? kids.map(c=>`<span class="mono" style="font-size:12.5px;${c.data.kind==='module-ref'?'opacity:.6':''}">${c.data.kind==="function"?"● ":""}${esc(treeLabel({data:c.data}))}</span>`).join("") : '<span class="empty">— leaf (nothing else runs from here) —</span>'}</div>`;
}
function renderHubs(){
  if(scope==="exec"){
    const fns = DATA.nodes.filter(n=>n.kind==="function").sort((a,b)=>(a.file+a.line).localeCompare(b.file+b.line));
    document.getElementById("hubs").innerHTML = fns.map(n=>`<li><span class="name mono" data-id="${esc(n.id)}">${esc(nodeLabel(n))}</span><span class="v">:${n.line}</span></li>`).join("");
    document.querySelectorAll("#hubs .name").forEach(a=>a.onclick=()=>select(a.dataset.id));
    return;
  }
  const key = "fan_in";
  const top = DATA.nodes.slice().sort((a,b)=>b[key]-a[key]).slice(0,10);
  const max = top[0]?.[key]||1;
  document.getElementById("hubs").innerHTML = top.map(n=>`<li><span class="name mono" data-id="${esc(n.id)}">${esc(nodeLabel(n))}</span><span class="v">${n[key]}</span><span class="bar"><i style="width:${Math.round(n[key]/max*100)}%;background:${catColor(n.cat)}"></i></span></li>`).join("");
  document.querySelectorAll("#hubs .name").forEach(a=>a.onclick=()=>select(a.dataset.id));
}

function render(){
  if(isTree()){ renderTree(); return; }
  const hideTests = document.getElementById("hideTests").checked && scope==="runtime";
  const minW = +document.getElementById("minW").value;
  const keep = n => !(hideTests && n.cat==="test");
  const nodes = DATA.nodes.filter(keep);
  const nset = new Set(nodes.map(n=>n.id));
  const links = DATA.links.filter(l=>l.count>=minW && nset.has(l.source) && nset.has(l.target)).map(l=>({...l}));
  nodes.forEach(n=>{ const o=posCache.get(n.id); if(o){ n.x=o.x; n.y=o.y; } });

  linkSel = gLink.selectAll("path").data(links, d=>d.source+"->"+d.target);
  linkSel.exit().remove();
  linkSel = linkSel.enter().append("path").attr("fill","none").attr("stroke",getVar("--line")).attr("marker-end","url(#arw-default)").merge(linkSel)
    .attr("stroke-width",d=>ew(d.count))
    .attr("stroke-dasharray", d=> d.type==="require" ? "4 3" : null);

  nodeSel = gNode.selectAll("g.node").data(nodes, d=>d.id);
  nodeSel.exit().remove();
  const en = nodeSel.enter().append("g").attr("class","node").style("cursor","pointer")
    .call(d3.drag()
      .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on("click",(e,d)=>{ e.stopPropagation(); select(d.id); });
  en.append("circle");
  en.append("text").attr("class","mono").attr("font-size",10).attr("text-anchor","middle").attr("fill",getVar("--ink"));
  nodeSel = en.merge(nodeSel);
  nodeSel.select("circle").attr("r",rad)
    .attr("fill",d=> (scope==="exec" && d.kind==="toplevel") ? getVar("--surface") : catColor(d.cat))
    .attr("stroke", d=>{
      if(scope==="exec") return d.kind==="toplevel" ? getVar("--muted") : getVar("--surface");
      return (scope==="runtime" && d.load) ? getVar("--accent") : getVar("--surface");
    })
    .attr("stroke-width", d=>{
      if(scope==="exec") return d.kind==="toplevel" ? 2 : 1.5;
      return (scope==="runtime" && d.load) ? 2 : 1.5;
    })
    .attr("stroke-dasharray", d=>{
      if(scope==="exec") return d.kind==="toplevel" ? "3 2" : null;
      return (scope==="runtime" && d.load) ? "3 2" : null;
    });
  nodeSel.select("text").attr("y",d=>-rad(d)-3).text(d=>nodeLabel(d));

  sim.nodes(nodes).on("tick",tick);
  sim.force("link").links(links);
  sim.alpha(.7).restart();
  applyHighlight();
}
function tick(){
  linkSel.attr("d",d=>`M${d.source.x},${d.source.y}L${d.target.x},${d.target.y}`);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
  nodeSel.each(d=>posCache.set(d.id,{x:d.x,y:d.y}));
}
function neighbors(id){ const a=adj.get(id); const s=new Set([id]); a.in.forEach(l=>s.add(l.source)); a.out.forEach(l=>s.add(l.target)); return s; }
function applyHighlight(){
  if(!nodeSel) return;
  if(!selected){ nodeSel.style("opacity",1); linkSel.style("opacity",.5).attr("stroke",getVar("--line")).attr("marker-end","url(#arw-default)"); return; }
  const nb = neighbors(selected);
  nodeSel.style("opacity",d=>nb.has(d.id)?1:.12);
  linkSel.style("opacity",d=>{ const on=(d.source.id||d.source)===selected||(d.target.id||d.target)===selected; return on?.95:.05; })
    .attr("stroke",d=>{ const on=(d.source.id||d.source)===selected||(d.target.id||d.target)===selected; return on?getVar("--accent"):getVar("--line"); })
    .attr("marker-end",d=>{ const on=(d.source.id||d.source)===selected||(d.target.id||d.target)===selected; return on?"url(#arw-hi)":"url(#arw-default)"; });
}
function select(id){ if(isTree()) return; selected=(selected===id?null:id); renderDetails(); applyHighlight(); }
function renderDetails(){
  const el=document.getElementById("details");
  if(!selected){ el.innerHTML=`<h2>Selected module</h2><div class="empty">Click a node to inspect its call flow.</div>`; return; }
  const n=byId.get(selected); const a=adj.get(selected);
  const verb = scope==="runtime" ? ["Called by","Calls into"] : scope==="load" ? ["Required by","Requires"] : ["Triggered by","Triggers"];
  const callers=a.in.slice().sort((x,y)=>y.count-x.count), callees=a.out.slice().sort((x,y)=>y.count-x.count);
  const nm = id => { const t=byId.get(id); return t? nodeLabel(t) : id; };
  const row=l=>{ const other=l.source===selected?l.target:l.source; return `<a data-id="${esc(other)}">${esc(nm(other))}${scope==="exec"?` <span class="v">·${l.type}</span>`:` <span class="v">·${l.count}</span>`}</a>`; };
  const title = scope==="exec" ? (n.kind==="function"?"Executed function":"Module top-level") : "Selected module";
  const meta = scope==="exec"
    ? `${n.file}:${n.line||"top-level"} · ${n.kind==="function"?"runs at load":"loads at require"}`
    : `${(CAT[n.cat]||CAT.other).label} · ${n.loc} LOC · fan-in ${n.fan_in} · fan-out ${n.fan_out}${(scope==="runtime"&&n.load)?" · runs on require":""}`;
  el.innerHTML=`<h2>${title}</h2><div class="mod mono">${esc(scope==="exec"?nodeLabel(n):n.id)}</div>
    <div class="meta">${esc(meta)}</div>
    <div class="nlist">
      <div class="lbl">${verb[0]} (${callers.length})</div>${callers.length?callers.map(row).join(""):'<span class="empty">— none —</span>'}
      <div class="lbl">${verb[1]} (${callees.length})</div>${callees.length?callees.map(row).join(""):'<span class="empty">— none —</span>'}
    </div>`;
  el.querySelectorAll("a[data-id]").forEach(a=>a.onclick=()=>select(a.dataset.id));
}

function setScope(s){
  if(s===scope && DATA) return;
  scope=s; selected=null; DATA=SCOPES[s]; posCache.clear();
  document.querySelectorAll(".scopebtn").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.s===s)));
  gLink.selectAll("*").remove(); gNode.selectAll("*").remove();   // clear previous layout
  if(!isTree()) svg.call(zoomBehavior.transform, d3.zoomIdentity);
  buildIndex(); renderMeta(); renderHubs(); renderDetails(); render();
}
document.querySelectorAll(".scopebtn").forEach(b=>b.addEventListener("click",()=>setScope(b.dataset.s)));
document.getElementById("treeExpand").addEventListener("click", expandAll);
document.getElementById("hideTests").addEventListener("change", render);
document.getElementById("minW").addEventListener("input", e=>{ document.getElementById("minWv").textContent=e.target.value; render(); });
window.addEventListener("resize", ()=>{ W=svg.node().clientWidth; H=svg.node().clientHeight; svg.attr("viewBox",[0,0,W,H]); sim.force("center",d3.forceCenter(W/2,H/2)); sim.alpha(.3).restart(); });

setScope("exec");
</script>
